services:
  frontend:
    image: ${REGISTRY}/kvault-frontend:latest
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
    container_name: kvault_frontend

  api:
    image: ${REGISTRY}/kvault:latest
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    container_name: kvault_api

  worker:
    image: ${REGISTRY}/kvault:latest
    command: ["./worker"]
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    container_name: kvault_worker

  migrate:
    image: ${REGISTRY}/kvault:latest
    command: ["./migrate", "up"]
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
    restart: "no"
    container_name: kvault_migrate

  redis:
    image: ${REGISTRY}/kvault-redis:latest
    restart: unless-stopped
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    container_name: kvault_redis

  pg:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: kvault_pg

  garage:
    image: dxflrs/garage:v2.2.0
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - "./docker/garage/garage.toml:/etc/garage.toml"
      - "./tmp/garage/meta:/var/lib/garage/meta"
      - "./tmp/garage/data:/var/lib/garage/data"
    container_name: kvault_garage

volumes:
  pg_data:
