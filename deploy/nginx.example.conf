# Reference reverse-proxy config for kvault behind HTTPS on a single domain.
#
# Serves the frontend at https://kvault.example.com/ and Garage S3 at the
# /kvault-bucket/ path on the SAME domain, so presigned file links work over
# HTTPS without exposing port 3900 or a separate subdomain.
#
# Replace kvault.example.com with your domain. TLS certs below assume certbot:
#   sudo certbot --nginx -d kvault.example.com
#
# Matching .env:
#   FRONTEND_PORT=8081
#   API_CORS_ORIGINS=https://kvault.example.com
#   AWS_S3_BUCKET=kvault-bucket
#   AWS_PUBLIC_ENDPOINT_URL=https://kvault.example.com

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name kvault.example.com;

    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    server_name kvault.example.com;

    ssl_certificate     /etc/letsencrypt/live/kvault.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kvault.example.com/privkey.pem;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Files can be large — raise the request body limit
    client_max_body_size 100M;

    location / {
        proxy_pass http://localhost:8081;          # frontend container (FRONTEND_PORT)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Path must match AWS_S3_BUCKET; presigned links are
    # https://kvault.example.com/kvault-bucket/<key>?...
    location /kvault-bucket/ {
        proxy_pass http://127.0.0.1:3900;          # local Garage S3
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for S3 chunked uploads — without it nginx buffers the body
        # and Garage rejects the request
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
